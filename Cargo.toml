[package]
name = "red"
version = "0.1.0"
edition = "2024"
description = "red — 终端 Markdown 阅读器（TUI）"
license = "MIT"

[features]
default = []
native-images = ["dep:image", "dep:ratatui-image"]

[dependencies]
ratatui = "0.30"
pulldown-cmark = "0.13"
syntect = "5"
unicode-width = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = "8"
image = { version = "0.25.6", optional = true, default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
ratatui-image = { version = "11.1.0", optional = true, default-features = false }
